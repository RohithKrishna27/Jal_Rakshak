<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Earth Globe - Jal Rakshak</title>
    
    <!-- Cesium.js CSS -->
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.117.0/Widgets/widgets.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        #cesiumContainer {
            width: 100%;
            height: 100%;
            position: relative;
            background: linear-gradient(135deg, #1e3a5f 0%, #2563a0 50%, #3b82f6 100%);
        }
        
        .cesium-widget {
            width: 100% !important;
            height: 100% !important;
        }
        
        .cesium-viewer {
            width: 100% !important;
            height: 100% !important;
        }
        
        /* Hide default UI elements that obstruct the view */
        .cesium-viewer-bottom {
            display: none !important;
        }
        
        .cesium-credit-container {
            display: none !important;
        }
        
        /* Optimize performance */
        .cesium-viewer-cesiumWidgetContainer {
            background: transparent !important;
        }
        
        .cesium-widget-credits {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    
    <!-- Cesium.js Library from CDN -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.117.0/Cesium.js"></script>
    
    <script>
        // IMPORTANT: Set CESIUM_BASE_URL BEFORE using Cesium
        window.CESIUM_BASE_URL = 'https://cesium.com/downloads/cesiumjs/releases/1.117.0/';
        
        // Initialize the Cesium viewer
        const viewer = new Cesium.Viewer('cesiumContainer', {
            // Camera options
            shouldAnimate: true,
            requestRenderMode: false,
            maximumRenderTimeChange: Infinity,
            
            // UI Controls - minimize for clean interface
            animation: false,
            timeline: false,
            baseLayerPicker: false,
            geocoder: false,
            homeButton: true,
            navigationHelpButton: false,
            sceneModePicker: false,
            fullscreenButton: true,
            infoBox: false,
            selectionIndicator: false,
            
            // Terrain
            terrainProviderViewModels: [],
            
            // Custom imagery provider (ArcGIS World Imagery)
            imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
                url: 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer',
                enablePickFeatures: false,
                maximumLevel: 19
            })
        });
        
        // Configure scene lighting and atmosphere
        viewer.scene.lightSource.enabled = false;
        viewer.scene.globe.enableLighting = false;
        viewer.scene.globe.showGroundAtmosphere = false;
        
        // Disable atmospheric effects for clean daytime view
        viewer.scene.skyAtmosphere.enabled = false;
        viewer.scene.sun.show = false;
        viewer.scene.moon.show = false;
        viewer.scene.fog.enabled = false;
        
        // Set background color
        viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#87CEEB');
        
        // Camera configuration - wide Earth view
        viewer.camera.setView({
            destination: Cesium.Cartesian3.fromDegrees(
                10,          // longitude
                30,          // latitude  
                18000000     // height in meters (wide view)
            ),
            orientation: {
                heading: Cesium.Math.toRadians(0),
                pitch: Cesium.Math.toRadians(-60),
                roll: 0
            }
        });
        
        // Configure camera controls
        const controller = viewer.scene.screenSpaceCameraController;
        controller.enableRotate = true;
        controller.enableZoom = true;
        controller.enableTilt = true;
        controller.enableTranslate = true;
        controller.minimumZoomDistance = 2000000;  // ~3,000 km minimum
        controller.maximumZoomDistance = 30000000;  // ~47,000 km maximum
        
        // Log initialization
        console.log('✅ Cesium Viewer initialized successfully');
        console.log('🌍 Earth globe is ready');
    </script>
</body>
</html>
